<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koordinaten-Tests</title>
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; margin: 16px; background: #fff; color: #111; }
  .pass { color: #1a7f37; } .fail { color: #cf222e; font-weight: bold; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
</head>
<body>
<h1 id="summary">Tests laufen …</h1>
<ul id="out"></ul>
<script type="module">
import { CONFIG, createConverter, facing, nether, fromNether, parseCoords, formatCoords } from "./coords.js?v=20261028g";
import { pointInFeature, biomeFor } from "./biome.js?v=20261028g";
import { sunElevation, mcTicks, dayPhase, skyTint } from "./sky.js?v=20261028g";
import { describeWeather } from "./weather.js?v=20261028g";
import { loadWaypoints, saveWaypoints, addWaypoint, removeWaypoint } from "./waypoints.js?v=20261028g";
import { ACHIEVEMENTS, inArea, placesReached, loadUnlocked, saveUnlocked } from "./achievements.js?v=20261028g";

const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, ok: true }); }
  catch (err) { results.push({ name, ok: false, msg: err.message }); }
}
function eq(actual, expected, label = "") {
  if (actual !== expected) throw new Error(`${label} erwartet ${expected}, erhalten ${actual}`);
}
function near(actual, expected, tol, label = "") {
  if (Math.abs(actual - expected) > tol) throw new Error(`${label} erwartet ${expected} ±${tol}, erhalten ${actual}`);
}

const conv = createConverter(proj4);

// Referenzwerte unabhängig mit pyproj (EPSG:4326 → EPSG:25832) berechnet.
test("Ursprung in UTM stimmt mit pyproj überein", () => {
  near(conv.origin.e, 405585.597, 0.01, "E");
  near(conv.origin.n, 5757827.192, 0.01, "N");
});

test("Ursprung ergibt (0, 0)", () => {
  const p = conv.toMinecraft(CONFIG.origin.lat, CONFIG.origin.lon);
  eq(p.x, 0, "X"); eq(p.z, 0, "Z");
  eq(Object.is(p.x, -0) || Object.is(p.z, -0), false, "negative Null");
});

test("100 m nördlich ergibt Z = −100", () => {
  const north = conv.fromMinecraft(0, -100);
  if (north.lat <= CONFIG.origin.lat) throw new Error("Z = −100 liegt nicht nördlich");
  near(north.n - conv.origin.n, 100, 1e-6, "ΔN");
  const p = conv.toMinecraft(north.lat, north.lon);
  eq(p.x, 0, "X"); eq(p.z, -100, "Z");
});

test("100 m östlich ergibt X = +100", () => {
  const east = conv.fromMinecraft(100, 0);
  if (east.lon <= CONFIG.origin.lon) throw new Error("X = 100 liegt nicht östlich");
  const p = conv.toMinecraft(east.lat, east.lon);
  eq(p.x, 100, "X"); eq(p.z, 0, "Z");
});

for (const [name, lat, lon, x, z] of [
  ["Lambertikirche", 51.96253, 7.62806, 154, 68],
  ["Aasee", 51.9555, 7.6105, -1068, 827],
  ["Hauptbahnhof", 51.9566, 7.6353, 639, 736],
]) {
  test(`${name} stimmt mit pyproj überein (${x} / ${z})`, () => {
    const p = conv.toMinecraft(lat, lon);
    eq(p.x, x, "X"); eq(p.z, z, "Z");
  });
}

test("Hin- und Rückrechnung ist verlustfrei (±1 Block) über ±10 km", () => {
  for (let x = -10000; x <= 10000; x += 1250) {
    for (let z = -10000; z <= 10000; z += 1250) {
      const ll = conv.fromMinecraft(x, z);
      const p = conv.toMinecraft(ll.lat, ll.lon);
      if (Math.abs(p.x - x) > 1 || Math.abs(p.z - z) > 1) {
        throw new Error(`(${x}, ${z}) → (${p.x}, ${p.z})`);
      }
    }
  }
});

test("Y aus NN-Höhe und ellipsoidischer GPS-Höhe", () => {
  eq(conv.yFromNN(60), 60, "NN 60");
  eq(conv.yFromEllipsoidal(104.2), 60, "ellipsoidisch 104,2");
  eq(conv.yFromEllipsoidal(null), null, "ohne Höhe");
  const shifted = createConverter(proj4, { ...CONFIG, yOffset: 10 });
  eq(shifted.yFromNN(60), 70, "mit Offset");
});

test("Facing wie im F3-Screen", () => {
  for (const [h, name, yaw] of [[0, "north", 180], [90, "east", -90], [180, "south", 0], [270, "west", 90],
                                [44, "north"], [46, "east"], [359, "north"], [-90, "west"]]) {
    const f = facing(h);
    eq(f.name, name, `${h}°`);
    if (yaw !== undefined) eq(f.yaw, yaw, `Yaw bei ${h}°`);
  }
  eq(facing(0).towards, "Towards negative Z");
});

test("Nether-Koordinaten = Oberwelt / 8, abgerundet", () => {
  const a = nether(15, 8); eq(a.x, 1); eq(a.z, 1);
  const b = nether(-1, -9); eq(b.x, -1); eq(b.z, -2);
});

test("Nether → Oberwelt landet im passenden 8×8-Bereich", () => {
  for (const [x, z] of [[0, 0], [19, 8], [-173, 161], [-1, -2]]) {
    const o = fromNether(x, z);
    const back = nether(o.x, o.z);
    eq(back.x, x, `X ${x}`); eq(back.z, z, `Z ${z}`);
  }
});

test("Eingefügte Koordinaten werden in vielen Formaten erkannt", () => {
  for (const [input, x, y, z] of [
    ["639 60 736", 639, 60, 736],
    ["639, 736", 639, null, 736],
    ["-1068 / 827", -1068, null, 827],
    ["X: 639 Z: -872", 639, null, -872],
    ["x=154 y=64 z=68", 154, 64, 68],
    ["XYZ: 639 / 60 / 736", 639, 60, 736],
    ["/tp @s 639 ~ 736", 639, null, 736],
    ["  639.6   60   −736  ", 640, 60, -736],
    ["Münster 1:1 · Ursprung St.-Paulus-Dom\nXYZ: 12 / 58 / -34\nNether: 1 / -5", 12, 58, -34],
    ["Ich bin bei 639 ~ 736! https://bfst134.github.io/muenster-minecraft/?x=639&z=736", 639, null, 736],
  ]) {
    const c = parseCoords(input);
    if (!c) throw new Error(`"${input}" nicht erkannt`);
    eq(c.x, x, `X aus "${input}"`); eq(c.y, y, `Y aus "${input}"`); eq(c.z, z, `Z aus "${input}"`);
  }
});

test("Uneindeutige Eingaben werden abgelehnt", () => {
  for (const input of ["", "hallo", "639", "1 2 3 4", "~ 60 736", "99999999 0"]) {
    eq(parseCoords(input), null, `"${input}"`);
  }
});

test("Kopierformat passt zu /tp", () => {
  eq(formatCoords({ x: 639, y: 60, z: 736 }), "639 60 736");
  eq(formatCoords({ x: -3, y: null, z: 0 }), "-3 ~ 0");
  const back = parseCoords(formatCoords({ x: -3, y: null, z: 176 }));
  eq(back.x, -3); eq(back.y, null); eq(back.z, 176);
});

test("Punkt-in-Polygon mit Loch und Multipolygon", () => {
  const square = { type: "Polygon", coordinates: [[[0, 0], [10, 0], [10, 10], [0, 10], [0, 0]], [[4, 4], [6, 4], [6, 6], [4, 6], [4, 4]]] };
  eq(pointInFeature([2, 2], square), true, "innen");
  eq(pointInFeature([5, 5], square), false, "im Loch");
  eq(pointInFeature([11, 5], square), false, "außen");
  const multi = { type: "MultiPolygon", coordinates: [square.coordinates, [[[20, 20], [30, 20], [30, 30], [20, 30], [20, 20]]]] };
  eq(pointInFeature([25, 25], multi), true, "zweites Polygon");
  eq(pointInFeature([5, 5], { type: "LineString", coordinates: [] }), false, "keine Fläche");
});

test("Biome aus Kartenflächen", () => {
  eq(biomeFor({ water: "river" }), "minecraft:river");
  eq(biomeFor({ water: "lake", landuse: "residential" }), "minecraft:ocean", "Wasser schlägt Wohngebiet");
  eq(biomeFor({ landcover: "wood", park: true }), "minecraft:forest");
  eq(biomeFor({ park: true }), "minecraft:meadow");
  eq(biomeFor({ landuse: "cemetery" }), "minecraft:dark_forest");
  eq(biomeFor({ landuse: "residential" }), "minecraft:plains");
  eq(biomeFor({}), "minecraft:plains");
  eq(biomeFor({ water: "lake" }, "nether"), "minecraft:basalt_deltas");
  eq(biomeFor({}, "nether"), "minecraft:nether_wastes");
});

// Höchster Sonnenstand eines Tages (minutengenau abgetastet) und die Uhrzeit dazu
function solarNoon(y, m, d) {
  let best = { elev: -90, date: null };
  for (let min = 9 * 60; min < 15 * 60; min++) {
    const date = new Date(Date.UTC(y, m, d, 0, min));
    const elev = sunElevation(date, CONFIG.origin.lat, CONFIG.origin.lon);
    if (elev > best.elev) best = { elev, date };
  }
  return best;
}

test("Sonnenhöchststand in Münster: Sommer ≈ 61,5°, Winter ≈ 14,6°", () => {
  near(solarNoon(2026, 5, 21).elev, 90 - CONFIG.origin.lat + 23.44, 0.6, "21. Juni");
  near(solarNoon(2026, 11, 21).elev, 90 - CONFIG.origin.lat - 23.44, 0.6, "21. Dezember");
});

test("Minecraft-Zeit: Mittag = 6000, Mitternacht = 18000", () => {
  for (const [m, d] of [[1, 10], [5, 21], [10, 3]]) {
    const noon = solarNoon(2026, m, d).date;
    near(mcTicks(noon, CONFIG.origin.lon), 6000, 25, `Mittag ${d}.${m + 1}.`);
    const midnight = new Date(noon.getTime() + 12 * 3600000);
    near(mcTicks(midnight, CONFIG.origin.lon), 18000, 25, `Mitternacht ${d}.${m + 1}.`);
  }
});

test("Tagesphase und Färbung nach Sonnenstand", () => {
  eq(dayPhase(30), "Tag"); eq(dayPhase(0), "Dämmerung"); eq(dayPhase(-10), "Nacht");
  eq(skyTint(30), null, "Tag ohne Färbung");
  eq(skyTint(-20), "rgb(55,65,125)", "Nacht");
  eq(skyTint(-4), "rgb(150,120,190)", "Dämmerung");
});

test("Wettercodes werden zu Text und Effekt", () => {
  eq(describeWeather(0).fx, null, "klar");
  eq(describeWeather(61).label, "Regen");
  eq(describeWeather(61).fx, "rain");
  eq(describeWeather(75).fx, "snow");
  eq(describeWeather(95).fx, "storm");
  eq(describeWeather(45).fx, "fog");
  eq(describeWeather(1234).label, "Unbekannt");
});

test("Wegpunkte anlegen, speichern, laden und löschen", () => {
  const mem = { data: {}, getItem(k) { return this.data[k] ?? null; }, setItem(k, v) { this.data[k] = v; } };
  let list = loadWaypoints(mem);
  eq(list.length, 0, "leer am Anfang");
  list = addWaypoint(list, { name: "  Zuhause  ", x: 12, y: 58, z: -34, color: "blau" });
  list = addWaypoint(list, { name: "", x: 1, z: 2, color: "gibtsnicht" });
  eq(list[0].name, "Zuhause", "Name getrimmt");
  eq(list[1].name, "Wegpunkt 2", "Standardname");
  eq(list[1].color, "rot", "unbekannte Farbe → rot");
  eq(addWaypoint([], { name: "x".repeat(40), x: 0, z: 0 })[0].name.length, 24, "Name gekürzt");
  saveWaypoints(list, mem);
  const loaded = loadWaypoints(mem);
  eq(loaded.length, 2, "geladen");
  eq(loaded[0].z, -34);
  eq(removeWaypoint(loaded, loaded[0].id).length, 1, "gelöscht");
  mem.data["mc-waypoints"] = "kaputt{";
  eq(loadWaypoints(mem).length, 0, "kaputte Daten → leere Liste");
});

test("Fortschritte: Orte per Radius und Rechteck", () => {
  const dom = ACHIEVEMENTS.find((a) => a.id === "spawn").area;
  eq(inArea(dom.lat, dom.lon, dom), true, "am Dom");
  const north100 = conv.fromMinecraft(0, -100);
  eq(inArea(north100.lat, north100.lon, dom), false, "100 m nördlich ist zu weit");
  eq(inArea(north100.lat, north100.lon, dom, 40), true, "mit 40 m GPS-Ungenauigkeit reicht es");
  const north200 = conv.fromMinecraft(0, -200);
  eq(inArea(north200.lat, north200.lon, dom, 500), false, "Ungenauigkeit zählt höchstens 50 m");
  eq(placesReached(51.9512676, 7.6061360, 10, {}).includes("aasee"), true, "mitten auf dem Aasee");
  eq(placesReached(51.9512676, 7.6061360, 10, { aasee: "2026-10-28" }).includes("aasee"), false, "schon erreicht");
  eq(placesReached(52.1, 7.4, 10, {}).length, 0, "weit draußen nichts");
  eq(new Set(ACHIEVEMENTS.map((a) => a.id)).size, ACHIEVEMENTS.length, "Ids eindeutig");
});

test("Fortschritte speichern und laden", () => {
  const mem = { data: {}, getItem(k) { return this.data[k] ?? null; }, setItem(k, v) { this.data[k] = v; } };
  eq(Object.keys(loadUnlocked(mem)).length, 0, "leer");
  saveUnlocked({ spawn: "2026-10-28" }, mem);
  eq(loadUnlocked(mem).spawn, "2026-10-28");
  mem.data["mc-achievements"] = "[1,2]";
  eq(Object.keys(loadUnlocked(mem)).length, 0, "falsches Format → leer");
});

const failed = results.filter((r) => !r.ok);
document.getElementById("summary").textContent =
  failed.length ? `${failed.length} von ${results.length} Tests fehlgeschlagen` : `Alle ${results.length} Tests bestanden`;
document.getElementById("out").innerHTML = results
  .map((r) => `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "✓" : "✗"} ${r.name}${r.msg ? ": " + r.msg : ""}</li>`)
  .join("");
window.__testResults = results;
</script>
</body>
</html>
