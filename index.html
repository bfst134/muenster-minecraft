<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b8731">
<title>Münster Koordinaten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<style>
  :root {
    --pixel: "Pixelify Sans", ui-monospace, Menlo, monospace;
    /* Für Zahlen: "~" und "-" müssen klar unterscheidbar sein */
    --digits: "VT323", ui-monospace, Menlo, monospace;
    --text: #fff;
    --shadow: #3f3f3f;
    --f3-bg: rgba(80, 80, 80, 0.62);
    --slot-bg: rgba(0, 0, 0, 0.58);
    --btn: #727272;
    --btn-hi: #a8a8a8;
    --btn-lo: #4a4a4a;
    --btn-hover: #7d86b4;
    --yellow: #ffff55;
    --green: #55ff55;
    --red: #ff5555;
    --gray: #aaaaaa;
    --aqua: #55ffff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #3b2a1d; color: var(--text);
    font: 17px/1.3 var(--pixel);
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  .shadow, button, .slot, #f3, #chat, #settings { text-shadow: 2px 2px 0 var(--shadow); }

  #stage { position: relative; flex: 1; min-height: 0; }
  #map, #labels { position: absolute; inset: 0; }
  #map { background: #7fb238; }
  /* Beschriftungen und Marker liegen als zweite, scharfe Karte darüber und fangen keine Berührungen ab */
  #labels { pointer-events: none; z-index: 1; }
  /* Pixel-Look: Karte in niedriger Auflösung zeichnen, ohne Glättung hochskalieren */
  #map.pixel .maplibregl-canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  .maplibregl-ctrl-top-right, .maplibregl-ctrl-bottom-right { z-index: 3; }
  .maplibregl-ctrl-attrib { font: 12px var(--pixel); }
  .maplibregl-ctrl-top-right .maplibregl-ctrl { margin: 8px 8px 0 0; }

  /* Bedienelemente auf der Karte als Steinknöpfe */
  .maplibregl-ctrl-group { border-radius: 0; border: 2px solid #000; box-shadow: none; background: var(--btn); }
  .maplibregl-ctrl-group button {
    width: 36px; height: 36px; background-color: var(--btn); border-radius: 0;
    box-shadow: inset 2px 2px 0 var(--btn-hi), inset -2px -3px 0 var(--btn-lo);
  }
  .maplibregl-ctrl-group button + button { border-top: 2px solid #000; }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); }
  .maplibregl-ctrl-group button.gear { display: grid; place-items: center; padding: 0; }

  /* F3-Overlay: graue Hinterlegung pro Zeile wie im Spiel */
  #f3 {
    position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 56px;
    z-index: 4; pointer-events: none; font: 19px/1.15 var(--digits);
  }
  #f3 div { width: fit-content; max-width: 100%; background: var(--f3-bg); padding: 0 4px; }
  #f3 .gap { height: 6px; background: none; }
  #f3 .dim { color: #e0e0e0; }

  /* Chat unten links, Nachrichten blenden aus */
  #chat {
    position: absolute; left: 8px; right: 48px; bottom: 8px; z-index: 4;
    display: flex; flex-direction: column; align-items: flex-start;
    pointer-events: none; font: 19px/1.15 var(--digits);
  }
  #chat div {
    background: rgba(0, 0, 0, 0.5); padding: 1px 6px; max-width: 100%;
    transition: opacity 0.8s; overflow-wrap: anywhere;
  }
  #chat div.fade { opacity: 0; }
  .c-yellow { color: var(--yellow); } .c-green { color: var(--green); }
  .c-red { color: var(--red); } .c-gray { color: var(--gray); } .c-aqua { color: var(--aqua); }

  /* Panel: Erde mit Grasnarbe, Textur wird beim Start erzeugt. Kompakt, damit die Karte Platz hat. */
  #panel {
    background-color: #866043; background-repeat: repeat-x, repeat; background-position: top left, 0 14px;
    padding: 20px 8px calc(8px + env(safe-area-inset-bottom));
    display: grid; gap: 6px;
  }
  .slot { background: var(--slot-bg); border: 2px solid #000; padding: 5px 6px 5px 10px; display: grid; gap: 4px; }
  .line { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .label { color: var(--yellow); font-weight: 600; min-width: 2.4em; }
  .coords { font: 28px/1 var(--digits); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; gap: 4px; flex: none; }
  .sub { color: var(--gray); font-size: 13px; line-height: 1.25; flex: 1; min-width: 0; }
  .sub a { color: var(--aqua); }
  .row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }

  button.mc {
    font: 600 16px var(--pixel); color: var(--text); cursor: pointer;
    background: var(--btn); border: 2px solid #000; border-radius: 0;
    box-shadow: inset 2px 2px 0 var(--btn-hi), inset -2px -3px 0 var(--btn-lo);
    padding: 8px 14px; min-height: 42px;
  }
  button.mc:hover, button.mc:focus-visible { background: var(--btn-hover); outline: none; }
  button.mc:active { box-shadow: inset -2px -2px 0 var(--btn-hi), inset 2px 3px 0 var(--btn-lo); }
  button.mc:disabled { background: #2c2c2c; color: #a0a0a0; box-shadow: none; cursor: default; }
  button.mc[aria-pressed="true"] { background: #3d8a26; box-shadow: inset 2px 2px 0 #7fd45a, inset -2px -3px 0 #24561a; }
  button.mc.icon { width: 40px; min-height: 40px; height: 40px; padding: 0; display: grid; place-items: center; }
  button.mc.with-icon { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 10px; }
  input {
    flex: 1; min-width: 0; font: 22px var(--digits); color: var(--text);
    background: #000; border: 2px solid #a0a0a0; border-radius: 0; padding: 5px 8px; height: 40px;
  }
  input::placeholder { color: #707070; }
  input:focus { outline: none; border-color: #fff; }

  /* Einstellungen: abgedunkelter Hintergrund wie das Optionsmenü im Spiel */
  #settings {
    position: fixed; inset: 0; z-index: 10; background: rgba(16, 16, 16, 0.72);
    display: grid; place-items: center; padding: 16px;
  }
  #settings .box { width: min(100%, 360px); display: grid; gap: 14px; }
  #settings h2 { margin: 0; text-align: center; font: 600 22px var(--pixel); }
  #settings .group { display: grid; gap: 6px; }
  #settings .group .row button { flex: 1; }
  #settings .done { width: 100%; }

  /* Blockige Marker */
  .block { width: 18px; height: 18px; border: 2px solid #000; }
  .block.spawn { background: #f5c842; box-shadow: inset 2px 2px 0 #fff3a8, inset -2px -2px 0 #b8860b; }
  .block.me { background: #3fc6d6; box-shadow: inset 2px 2px 0 #b5f3fa, inset -2px -2px 0 #1d7e8a; }
  .block.target { background: #d33a2a; box-shadow: inset 2px 2px 0 #ff9a8a, inset -2px -2px 0 #7a1a10; }
</style>
</head>
<body>
<main id="stage">
  <div id="map" aria-label="Karte von Münster"></div>
  <div id="labels" aria-hidden="true"></div>
  <div id="f3" aria-hidden="true"></div>
  <div id="chat" role="log" aria-live="polite"></div>
</main>

<section id="panel">
  <div class="slot">
    <div class="line">
      <span class="label">Du</span>
      <span id="meCoords" class="coords">~ ~ ~</span>
      <span class="tools">
        <button id="gps" type="button" class="mc with-icon" data-icon="gps">GPS</button>
        <button id="copyMe" type="button" class="mc icon" data-icon="copy" aria-label="Eigene Koordinaten kopieren" hidden></button>
        <button id="shareMe" type="button" class="mc icon" data-icon="share" aria-label="Eigene Position teilen" hidden></button>
      </span>
    </div>
  </div>

  <form id="goto" class="slot" autocomplete="off">
    <div class="line">
      <span class="label">Ziel</span>
      <input id="paste" placeholder="Einfügen oder Karte antippen" enterkeyhint="go" aria-label="Koordinaten des Ziels">
      <span class="tools">
        <button id="pasteBtn" type="button" class="mc icon" data-icon="paste" aria-label="Aus Zwischenablage einfügen" hidden></button>
      </span>
    </div>
    <div id="targetLine" class="line" hidden>
      <span id="targetInfo" class="sub"></span>
      <span class="tools">
        <button id="copyTarget" type="button" class="mc icon" data-icon="copy" aria-label="Ziel kopieren"></button>
        <button id="shareTarget" type="button" class="mc icon" data-icon="share" aria-label="Ziel teilen"></button>
      </span>
    </div>
  </form>
</section>

<div id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="box">
    <h2 id="settingsTitle">Einstellungen</h2>
    <div class="group">
      <span class="label">Karte</span>
      <div class="row">
        <button type="button" class="mc" data-kind="mc">Minecraft</button>
        <button type="button" class="mc" data-kind="normal">Normal</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Pixel</span>
      <div class="row">
        <button type="button" class="mc" data-pixel="fein">Fein</button>
        <button type="button" class="mc" data-pixel="mittel">Mittel</button>
        <button type="button" class="mc" data-pixel="grob">Grob</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Ton</span>
      <div class="row">
        <button type="button" class="mc" data-sound="on">An</button>
        <button type="button" class="mc" data-sound="off">Aus</button>
      </div>
    </div>
    <button type="button" class="mc done" id="settingsDone">Fertig</button>
  </div>
</div>

<script type="module">
import { CONFIG, createConverter, facing, nether, parseCoords, formatCoords } from "./coords.js";
import { createMcMap, PIXEL_SIZES } from "./mcmap.js";
import { icon } from "./icons.js";

const conv = createConverter(proj4);
const $ = (id) => document.getElementById(id);

// Pixel-Icons in alle Buttons mit data-icon setzen (vor eventuellem Text)
function fillIcons(root = document) {
  root.querySelectorAll("[data-icon]").forEach((b) => b.insertAdjacentHTML("afterbegin", icon(b.dataset.icon)));
}
fillIcons();
const state = { player: null, heading: null, target: null };

// ---------- Einstellungen, gespeichert im Browser ----------
const settings = { kind: "mc", pixel: "mittel", sound: true };
try {
  Object.assign(settings, JSON.parse(localStorage.getItem("mc-settings") ?? "{}"));
  if (localStorage.getItem("mc-sound") === "off") settings.sound = false;
} catch {}
if (!(settings.pixel in PIXEL_SIZES)) settings.pixel = "mittel";
function saveSettings() {
  try { localStorage.setItem("mc-settings", JSON.stringify(settings)); } catch {}
}

// ---------- Texturen: Erde und Gras als Pixelraster, jeder Pixel 4×4 ----------
function rng(seed) {
  return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32);
}
function texture(w, h, pick, seed, s = 4) {
  const c = document.createElement("canvas");
  c.width = w * s; c.height = h * s;
  const ctx = c.getContext("2d"), r = rng(seed);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    ctx.fillStyle = pick(x, y, r); ctx.fillRect(x * s, y * s, s, s);
  }
  return c.toDataURL();
}
const dirt = ["#866043", "#866043", "#79553a", "#9b7653", "#593d29", "#6c4b33"];
const grass = ["#5b8731", "#6aa83a", "#4a7027", "#5f9134"];
const dirtTex = texture(16, 16, (x, y, r) => dirt[Math.floor(r() * dirt.length)], 7, 3);
const grassTex = texture(16, 7, (x, y, r) => {
  const depth = 4 + Math.floor(r() * 3);
  return y < depth ? grass[Math.floor(r() * grass.length)] : dirt[Math.floor(r() * dirt.length)];
}, 11, 3);
$("panel").style.backgroundImage = `url(${grassTex}), url(${dirtTex})`;

// ---------- Ton: kurzes, selbst erzeugtes Klicken ----------
let audio;
function click() {
  if (!settings.sound) return;
  try {
    audio ??= new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = "square"; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(260, t + 0.06);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.09);
  } catch {}
}
document.addEventListener("click", (ev) => { if (ev.target.closest("button")) click(); });

// ---------- Chat ----------
function chat(text, color = "") {
  const line = document.createElement("div");
  line.textContent = text;
  if (color) line.className = `c-${color}`;
  $("chat").append(line);
  while ($("chat").children.length > 4) $("chat").firstElementChild.remove();
  setTimeout(() => line.classList.add("fade"), 6000);
  setTimeout(() => line.remove(), 7000);
}

// ---------- Karte ----------
const mc = createMcMap({
  container: $("map"), labelsContainer: $("labels"),
  center: [CONFIG.origin.lon, CONFIG.origin.lat], zoom: 15,
  pixelSize: PIXEL_SIZES[settings.pixel], kind: settings.kind,
});
const map = mc.map;

// Zahnrad über dem Zoom, öffnet die Einstellungen
map.addControl({
  onAdd() {
    const el = document.createElement("div");
    el.className = "maplibregl-ctrl maplibregl-ctrl-group";
    el.innerHTML = `<button type="button" class="gear" aria-label="Einstellungen" title="Einstellungen">${icon("gear")}</button>`;
    el.querySelector("button").addEventListener("click", openSettings);
    return el;
  },
  onRemove() {},
}, "top-right");
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

const blockEl = (kind, title) => Object.assign(document.createElement("div"), { className: `block ${kind}`, title: title ?? "" });
mc.addMarker(blockEl("spawn", `Spawn · ${CONFIG.origin.name} · 0 ~ 0`), [CONFIG.origin.lon, CONFIG.origin.lat]);
let playerMarker, targetMarker;

// ---------- Einstellungsdialog ----------
function renderSettings() {
  for (const [attr, value] of [["kind", settings.kind], ["pixel", settings.pixel], ["sound", settings.sound ? "on" : "off"]]) {
    document.querySelectorAll(`[data-${attr}]`).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[attr] === value)));
  }
  document.querySelectorAll("[data-pixel]").forEach((b) => (b.disabled = settings.kind !== "mc"));
}
function openSettings() {
  renderSettings();
  $("settings").hidden = false;
  $("settingsDone").focus();
}
function closeSettings() { $("settings").hidden = true; }
$("settingsDone").addEventListener("click", closeSettings);
$("settings").addEventListener("click", (ev) => { if (ev.target === $("settings")) closeSettings(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !$("settings").hidden) closeSettings(); });
document.querySelectorAll("[data-kind]").forEach((b) => b.addEventListener("click", () => {
  settings.kind = b.dataset.kind; saveSettings(); mc.setKind(settings.kind); renderSettings();
}));
document.querySelectorAll("[data-pixel]").forEach((b) => b.addEventListener("click", () => {
  settings.pixel = b.dataset.pixel; saveSettings(); mc.setPixelSize(PIXEL_SIZES[settings.pixel]); renderSettings();
}));
document.querySelectorAll("[data-sound]").forEach((b) => b.addEventListener("click", () => {
  settings.sound = b.dataset.sound === "on"; saveSettings(); renderSettings();
}));

// ---------- Anzeige ----------
function renderF3() {
  const lines = [`Münster 1:1 · Spawn: ${CONFIG.origin.name}`];
  const p = state.player;
  if (p) {
    lines.push(`XYZ: ${p.x} / ${p.y ?? "~"} / ${p.z}`);
    const n = nether(p.x, p.z);
    lines.push(`Nether: ${n.x} / ${n.z}`);
  } else {
    lines.push("XYZ: ~ / ~ / ~");
  }
  if (state.heading != null) {
    const f = facing(state.heading);
    lines.push(`Facing: ${f.name} (${f.towards}) (${f.yaw.toFixed(1)})`);
  }
  if (p) {
    const acc = [`GPS ±${Math.round(p.accuracy)} m`];
    if (p.altitudeAccuracy != null) acc.push(`Höhe ±${Math.round(p.altitudeAccuracy)} m`);
    lines.push("", `<span class="dim">${acc.join(" · ")}</span>`);
  }
  $("f3").innerHTML = lines.map((l) => (l === "" ? '<div class="gap"></div>' : `<div>${l}</div>`)).join("");
  $("meCoords").textContent = p ? formatCoords(p) : "~ ~ ~";
}

function distanceText(t) {
  if (!state.player) return "";
  const dx = t.x - state.player.x, dz = t.z - state.player.z;
  const dist = Math.round(Math.hypot(dx, dz));
  if (dist === 0) return "Du bist da!";
  // Richtung als Kompasskurs: atan2(Ost, Nord), Nord = −Z
  const dir = facing((Math.atan2(dx, -dz) * 180) / Math.PI);
  return `${dist} Blöcke Richtung ${dir.name}`;
}

function renderTarget() {
  const t = state.target;
  $("targetLine").hidden = !t;
  if (!t) return;
  const n = nether(t.x, t.z);
  const lat = t.lat.toFixed(6), lon = t.lon.toFixed(6);
  const parts = [distanceText(t), `Nether ${n.x} / ${n.z}`].filter(Boolean).join(" · ");
  $("targetInfo").innerHTML = `${parts}<br>`
    + `<a href="https://maps.apple.com/?ll=${lat},${lon}&q=${encodeURIComponent(formatCoords(t))}" target="_blank" rel="noopener">Apple</a> · `
    + `<a href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank" rel="noopener">Google Maps</a>`;
}

function setTarget(c, { pan = false } = {}) {
  const { lat, lon } = conv.fromMinecraft(c.x, c.z);
  state.target = { x: c.x, y: c.y ?? null, z: c.z, lat, lon };
  if (!targetMarker) targetMarker = mc.addMarker(blockEl("target"), [lon, lat]);
  else targetMarker.setLngLat([lon, lat]);
  if (pan) map.easeTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 16.5) });
  renderTarget();
}

// ---------- Kopieren, Einfügen, Teilen ----------
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = Object.assign(document.createElement("textarea"), { value: text, readOnly: true });
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.append(ta); ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  return ok;
}

async function copyCoords(c) {
  const text = formatCoords(c);
  if (await copyText(text)) chat(`Koordinaten kopiert: ${text}`, "green");
  else chat("Kopieren hat nicht geklappt.", "red");
}

function shareUrl(c) {
  const u = new URL(location.pathname, location.origin);
  u.searchParams.set("x", c.x);
  if (c.y != null) u.searchParams.set("y", c.y);
  u.searchParams.set("z", c.z);
  return u.toString();
}

async function shareCoords(c, intro) {
  const text = `${intro} ${formatCoords(c)} in Münster ⛏`;
  const url = shareUrl(c);
  if (navigator.share) {
    try { await navigator.share({ title: "Münster in Minecraft-Koordinaten", text, url }); }
    catch (err) { if (err.name !== "AbortError") chat("Teilen hat nicht geklappt.", "red"); }
    return;
  }
  if (await copyText(`${text} ${url}`)) chat("Link kopiert, einfach einfügen und abschicken.", "green");
  else chat("Teilen hat nicht geklappt.", "red");
}

$("copyMe").addEventListener("click", () => state.player && copyCoords(state.player));
$("shareMe").addEventListener("click", () => state.player && shareCoords(state.player, "Ich bin gerade bei"));
$("copyTarget").addEventListener("click", () => state.target && copyCoords(state.target));
$("shareTarget").addEventListener("click", () => state.target && shareCoords(state.target, "Treffpunkt:"));

function applyInput({ pan, announce }) {
  const c = parseCoords($("paste").value);
  if (!c) {
    if (announce && $("paste").value.trim()) chat("Darin stecken keine Koordinaten. Beispiel: 154 64 68", "red");
    return;
  }
  setTarget(c, { pan });
  if (announce) chat(`Ziel gesetzt: ${formatCoords(c)}`, "yellow");
}

$("paste").addEventListener("input", (ev) => {
  const pasted = ev.inputType === "insertFromPaste";
  applyInput({ pan: pasted, announce: pasted });
});
$("goto").addEventListener("submit", (ev) => {
  ev.preventDefault();
  $("paste").blur();
  applyInput({ pan: true, announce: true });
});

if (navigator.clipboard?.readText) {
  $("pasteBtn").hidden = false;
  $("pasteBtn").addEventListener("click", async () => {
    try {
      $("paste").value = await navigator.clipboard.readText();
      applyInput({ pan: true, announce: true });
    } catch {
      chat("Kein Zugriff auf die Zwischenablage. Lange ins Feld tippen und einfügen.", "red");
    }
  });
}

map.on("click", (ev) => {
  const p = conv.toMinecraft(ev.lngLat.lat, ev.lngLat.lng);
  const c = { x: p.x, y: null, z: p.z };
  $("paste").value = formatCoords(c);
  setTarget(c);
});

// ---------- GPS und Kompass ----------
function onPosition(pos) {
  const { latitude: lat, longitude: lon, altitude, accuracy, altitudeAccuracy } = pos.coords;
  const p = conv.toMinecraft(lat, lon);
  const first = !state.player;
  state.player = { ...p, y: conv.yFromEllipsoidal(altitude), lat, lon, accuracy, altitudeAccuracy };
  if (!playerMarker) playerMarker = mc.addMarker(blockEl("me", "Du"), [lon, lat]);
  else playerMarker.setLngLat([lon, lat]);
  mc.setAccuracy(lat, lon, accuracy);
  if (first) {
    if (!state.target) map.easeTo({ center: [lon, lat], zoom: 17 });
    $("gps").hidden = true;
    $("copyMe").hidden = false;
    $("shareMe").hidden = false;
    chat(`Position gefunden: ${formatCoords(state.player)}`, "green");
  }
  renderF3();
  renderTarget();
}

function onPositionError(err) {
  const msg = { 1: "Standortzugriff verweigert.", 2: "Position nicht verfügbar.", 3: "GPS-Zeitüberschreitung." }[err.code];
  chat(msg || err.message, "red");
  $("gps").disabled = false;
}

// Kompass: iOS liefert webkitCompassHeading, Android deviceorientationabsolute (alpha gegen den Uhrzeigersinn).
function onOrientation(ev) {
  let heading = null;
  if (typeof ev.webkitCompassHeading === "number") heading = ev.webkitCompassHeading;
  else if (ev.absolute && ev.alpha != null) heading = 360 - ev.alpha;
  if (heading == null) return;
  heading += screen.orientation?.angle ?? 0;
  state.heading = ((heading % 360) + 360) % 360;
  renderF3();
}

async function startCompass() {
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) return;
  if (typeof DOE.requestPermission === "function") {
    try { if ((await DOE.requestPermission()) !== "granted") return; } catch { return; }
  }
  window.addEventListener("ondeviceorientationabsolute" in window ? "deviceorientationabsolute" : "deviceorientation", onOrientation);
}

$("gps").addEventListener("click", () => {
  if (!("geolocation" in navigator)) { chat("Kein GPS im Browser verfügbar.", "red"); return; }
  if (!window.isSecureContext) { chat("GPS braucht HTTPS (oder localhost).", "red"); return; }
  chat("Suche Position …", "gray");
  $("gps").disabled = true;
  startCompass();
  navigator.geolocation.watchPosition(onPosition, onPositionError, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
});

// ---------- Start ----------
renderF3();
const shared = location.search ? parseCoords(location.search) : null;
if (shared) {
  $("paste").value = formatCoords(shared);
  setTarget(shared, { pan: true });
  chat(`Geteilter Punkt: ${formatCoords(shared)}`, "yellow");
  chat("Tippe auf GPS starten, um die Entfernung zu sehen.", "gray");
} else {
  chat("Willkommen in Münster! Der Spawn ist am Dom.", "yellow");
}
</script>
