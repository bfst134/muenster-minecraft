<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b8731">
<title>Münster Koordinaten</title>
<!-- Homescreen: startet im Vollbild mit eigenem Icon -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Münster MC">
<!-- Schwarze Statusleiste über der App statt darüberliegend: sonst legt iOS dort einen Unschärfe-Verlauf
     über die oberste F3-Zeile und rechnet die Seitenhöhe ohne die Leiste (Lücke unten) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>
  // Vor dem ersten Zeichnen erkennen, ob die App vom Homescreen gestartet wurde
  if (navigator.standalone || matchMedia("(display-mode: standalone)").matches) document.documentElement.classList.add("standalone");
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<style>
  :root {
    --pixel: "Pixelify Sans", ui-monospace, Menlo, monospace;
    /* Für Zahlen: "~" und "-" müssen klar unterscheidbar sein */
    --digits: "VT323", ui-monospace, Menlo, monospace;
    --text: #fff;
    --shadow: #3f3f3f;
    --f3-bg: rgba(80, 80, 80, 0.62);
    --slot-bg: rgba(0, 0, 0, 0.58);
    --btn: #727272;
    --btn-hi: #a8a8a8;
    --btn-lo: #4a4a4a;
    --btn-hover: #7d86b4;
    --yellow: #ffff55;
    --green: #55ff55;
    --red: #ff5555;
    --gray: #aaaaaa;
    --aqua: #55ffff;
    /* Oben: schwarzer Streifen (--strip) und Abstand für F3 und Knöpfe (--safe-top). Im normalen Browser 0. */
    --strip: env(safe-area-inset-top, 0px);
    --safe-top: calc(var(--strip) * 1.25);
  }
  /* Homescreen-App: iOS startet die Seite unter der Statusleiste (Inset 0) und füllt die Leiste mit einer
     verschwommenen Fortsetzung des oberen Seitenrands, die etwa 20 pt in die Seite hineinreicht.
     Ein eigener schwarzer Streifen macht die Leiste schwarz; F3 und Knöpfe beginnen unterhalb der Unschärfe. */
  html.standalone {
    --strip: max(env(safe-area-inset-top, 0px), 22px);
    --safe-top: calc(var(--strip) + 14px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #3b2a1d; color: var(--text);
    font: 17px/1.3 var(--pixel);
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  .shadow, button, .slot, #f3, #chat, #settings { text-shadow: 2px 2px 0 var(--shadow); }

  #stage { position: relative; flex: 1; min-height: 0; }
  /* Schwarzer Streifen oben, damit in der Statusleiste keine verschwommene Karte zu sehen ist */
  #stage::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: var(--strip);
    background: #000; z-index: 9; pointer-events: none;
  }
  #map, #labels { position: absolute; inset: 0; }
  #map { background: #7fb238; }
  /* Beschriftungen und Marker liegen als zweite, scharfe Karte darüber und fangen keine Berührungen ab */
  #labels { pointer-events: none; z-index: 2; }
  #weather { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; image-rendering: pixelated; }
  /* Tag und Nacht: farbige Ebene, die die Karte multipliziert; Beschriftungen bleiben hell darüber */
  #sky { position: absolute; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: multiply; transition: background-color 2s; }
  /* Pixel-Look: Karte in niedriger Auflösung zeichnen, ohne Glättung hochskalieren */
  #map.pixel .maplibregl-canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  .maplibregl-ctrl-top-right, .maplibregl-ctrl-bottom-right { z-index: 5; }
  .maplibregl-ctrl-attrib { font: 12px var(--pixel); }
  .maplibregl-ctrl-top-right .maplibregl-ctrl { margin: 8px 8px 0 0; }
  /* Im Vollbild vom Homescreen unterhalb der Statusleiste und ihrer Unschärfe bleiben */
  .maplibregl-ctrl-top-right { top: var(--safe-top); }

  /* Bedienelemente auf der Karte als Steinknöpfe */
  .maplibregl-ctrl-group { border-radius: 0; border: 2px solid #000; box-shadow: none; background: var(--btn); }
  .maplibregl-ctrl-group button {
    width: 36px; height: 36px; background-color: var(--btn); border-radius: 0;
    box-shadow: inset 2px 2px 0 var(--btn-hi), inset -2px -3px 0 var(--btn-lo);
  }
  .maplibregl-ctrl-group button + button { border-top: 2px solid #000; }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); }
  .maplibregl-ctrl-group button.gear { display: grid; place-items: center; padding: 0; }

  /* F3-Overlay: graue Hinterlegung pro Zeile wie im Spiel */
  #f3 {
    position: absolute; top: calc(8px + var(--safe-top)); left: 8px; right: 56px;
    z-index: 6; pointer-events: none; font: 19px/1.15 var(--digits);
  }
  #f3 div { width: fit-content; max-width: 100%; background: var(--f3-bg); padding: 0 4px; }
  #f3 .gap { height: 6px; background: none; }
  #f3 .dim { color: #e0e0e0; }
  #f3 .nether { color: #ff7a6a; }

  /* Auf dem Handy zoomt man mit zwei Fingern; die Knöpfe würden nur die Leiste verlängern */
  @media (pointer: coarse) { .maplibregl-ctrl-group:has(.maplibregl-ctrl-zoom-in) { display: none; } }

  /* Fortschritt-Pop-up oben, gleitet herein */
  /* Versteckt: ganz über den oberen Rand samt Statusleiste geschoben und unsichtbar,
     damit im Vollbild vom Homescreen nichts unter der Statusleiste hervorschaut */
  #toast {
    position: absolute; top: calc(8px + var(--safe-top)); left: 50%; z-index: 8;
    width: min(300px, calc(100% - 16px));
    transform: translate(-50%, calc(-100% - 16px - var(--safe-top)));
    visibility: hidden; transition: transform 0.35s ease, visibility 0s linear 0.35s;
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    background: #212121; border: 2px solid #000; box-shadow: inset 2px 2px 0 #555, inset -2px -2px 0 #111;
    pointer-events: none; text-shadow: 2px 2px 0 var(--shadow);
  }
  #toast.show { transform: translate(-50%, 0); visibility: visible; transition: transform 0.35s ease, visibility 0s; }

  /* Zurück zur eigenen Position, unten rechts über der Quellenangabe */
  .maplibregl-ctrl-group button.locate { display: grid; place-items: center; padding: 0; width: 44px; height: 44px; }
  .maplibregl-ctrl-group button.locate[aria-pressed="true"] { background-color: #2f7f8c; box-shadow: inset 2px 2px 0 #7fd8e3, inset -2px -3px 0 #1b4d55; }
  #toast .head { color: var(--yellow); font-size: 15px; }
  #toast .title { color: #fff; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  .ach-item { display: flex; align-items: center; gap: 10px; background: var(--slot-bg); border: 2px solid #000; padding: 6px 8px; }
  .ach-item.locked { opacity: 0.55; }
  .ach-item .text { flex: 1; min-width: 0; }
  .ach-item .desc { color: var(--gray); font-size: 13px; }
  .ach-item .date { color: var(--green); font: 16px/1 var(--digits); }

  /* Lila Portal-Wirbel beim Dimensionswechsel */
  #portalFx {
    position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(196, 140, 240, 0.1) 0%, rgba(138, 58, 216, 0.8) 75%);
  }
  #portalFx.on { animation: portal 0.9s ease-out; }
  @keyframes portal { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #portalFx.on { animation: none; } }

  /* Chat unten links, Nachrichten blenden aus */
  #chat {
    position: absolute; left: 8px; right: 48px; bottom: 8px; z-index: 6;
    display: flex; flex-direction: column; align-items: flex-start;
    pointer-events: none; font: 19px/1.15 var(--digits);
  }
  #chat div {
    background: rgba(0, 0, 0, 0.5); padding: 1px 6px; max-width: 100%;
    transition: opacity 0.8s; overflow-wrap: anywhere;
  }
  #chat div.fade { opacity: 0; }
  .c-yellow { color: var(--yellow); } .c-green { color: var(--green); }
  .c-red { color: var(--red); } .c-gray { color: var(--gray); } .c-aqua { color: var(--aqua); }

  /* Panel: Erde mit Grasnarbe, Textur wird beim Start erzeugt. Kompakt, damit die Karte Platz hat. */
  #panel {
    background-color: #866043; background-repeat: repeat-x, repeat; background-position: top left, 0 14px;
    padding: 20px 8px calc(8px + env(safe-area-inset-bottom));
    display: grid; gap: 6px;
  }
  .slot { background: var(--slot-bg); border: 2px solid #000; padding: 5px 6px 5px 10px; display: grid; gap: 4px; }
  .line { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .label { color: var(--yellow); font-weight: 600; min-width: 2.4em; }
  .coords { font: 26px/1 var(--digits); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; gap: 4px; flex: none; }
  .sub { color: var(--gray); font-size: 13px; line-height: 1.25; flex: 1; min-width: 0; }
  .sub a { color: var(--aqua); }
  .row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }

  button.mc {
    font: 600 16px var(--pixel); color: var(--text); cursor: pointer;
    background: var(--btn); border: 2px solid #000; border-radius: 0;
    box-shadow: inset 2px 2px 0 var(--btn-hi), inset -2px -3px 0 var(--btn-lo);
    padding: 8px 14px; min-height: 42px;
  }
  button.mc:hover, button.mc:focus-visible { background: var(--btn-hover); outline: none; }
  button.mc:active { box-shadow: inset -2px -2px 0 var(--btn-hi), inset 2px 3px 0 var(--btn-lo); }
  button.mc:disabled { background: #2c2c2c; color: #a0a0a0; box-shadow: none; cursor: default; }
  button.mc[aria-pressed="true"] { background: #3d8a26; box-shadow: inset 2px 2px 0 #7fd45a, inset -2px -3px 0 #24561a; }
  button.mc.icon { width: 40px; min-height: 40px; height: 40px; padding: 0; display: grid; place-items: center; }
  button.mc.with-icon { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 10px; }
  input {
    flex: 1; min-width: 0; font: 22px var(--digits); color: var(--text);
    background: #000; border: 2px solid #a0a0a0; border-radius: 0; padding: 5px 8px; height: 40px;
  }
  input::placeholder { color: #707070; }
  input:focus { outline: none; border-color: #fff; }

  /* Dialoge: abgedunkelter Hintergrund wie das Optionsmenü im Spiel */
  .dialog {
    position: fixed; inset: 0; z-index: 10; background: rgba(16, 16, 16, 0.72);
    display: grid; place-items: center; padding: 16px; overflow-y: auto;
    text-shadow: 2px 2px 0 var(--shadow);
  }
  .dialog .box { width: min(100%, 360px); display: grid; gap: 14px; }
  .dialog h2 { margin: 0; text-align: center; font: 600 22px var(--pixel); }
  .dialog .group { display: grid; gap: 6px; }
  .dialog .group .row button, .dialog .actions button { flex: 1; }
  .dialog .done { width: 100%; }
  .dialog .actions { display: flex; gap: 8px; }
  #settings .box { gap: 10px; }
  .dialog .version { margin: 0; text-align: center; color: var(--gray); font: 16px var(--digits); }

  /* Wegpunkte */
  .swatch { width: 40px; height: 40px; border: 2px solid #000; box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.35); cursor: pointer; }
  .swatch[aria-pressed="true"] { outline: 3px solid #fff; outline-offset: 1px; }
  .wp-items { display: grid; gap: 6px; max-height: 55vh; overflow-y: auto; }
  .wp-item { display: flex; align-items: center; gap: 8px; background: var(--slot-bg); border: 2px solid #000; padding: 6px; }
  .wp-item .dot { width: 18px; height: 18px; border: 2px solid #000; flex: none; }
  .wp-item .text { flex: 1; min-width: 0; }
  .wp-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wp-item .pos { font: 18px/1 var(--digits); color: var(--gray); }
  .wp-empty { color: var(--gray); text-align: center; }
  /* Keine eigene position: MapLibre setzt Marker absolut, das trägt auch die Kinder */
  .wp-marker { width: 18px; height: 18px; pointer-events: auto; cursor: pointer; }
  .wp-marker .block { position: absolute; inset: 0; }
  .wp-marker .tag {
    position: absolute; top: 21px; left: 50%; transform: translateX(-50%);
    font: 16px/1 var(--digits); color: #fff; background: rgba(0, 0, 0, 0.6); padding: 1px 4px; white-space: nowrap;
  }

  /* Blockige Marker */
  .block { width: 18px; height: 18px; border: 2px solid #000; }
  .block.spawn { background: #f5c842; box-shadow: inset 2px 2px 0 #fff3a8, inset -2px -2px 0 #b8860b; }
  .block.me { background: #3fc6d6; box-shadow: inset 2px 2px 0 #b5f3fa, inset -2px -2px 0 #1d7e8a; }
  /* Blickrichtung: Pfeil kreist um den eigenen Block */
  .me-wrap { width: 18px; height: 18px; }
  .me-wrap .block { position: absolute; inset: 0; }
  .me-wrap .heading {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    display: flex; justify-content: center; pointer-events: none; transform: rotate(var(--heading, 0deg));
  }
  .block.target { background: #d33a2a; box-shadow: inset 2px 2px 0 #ff9a8a, inset -2px -2px 0 #7a1a10; }
</style>
</head>
<body>
<main id="stage">
  <div id="map" aria-label="Karte von Münster"></div>
  <div id="sky" hidden></div>
  <div id="labels" aria-hidden="true"></div>
  <canvas id="weather" aria-hidden="true" hidden></canvas>
  <div id="portalFx" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="f3" aria-hidden="true"></div>
  <div id="chat" role="log" aria-live="polite"></div>
</main>

<section id="panel">
  <div class="slot">
    <div class="line">
      <span class="label">Du</span>
      <span id="meCoords" class="coords">~ ~ ~</span>
      <span class="tools">
        <button id="gps" type="button" class="mc with-icon" data-icon="gps">GPS</button>
        <button id="copyMe" type="button" class="mc icon" data-icon="copy" aria-label="Eigene Koordinaten kopieren" hidden></button>
        <button id="shareMe" type="button" class="mc icon" data-icon="share" aria-label="Eigene Position teilen" hidden></button>
        <button id="saveMe" type="button" class="mc icon" data-icon="star" aria-label="Eigene Position als Wegpunkt speichern" hidden></button>
      </span>
    </div>
  </div>

  <form id="goto" class="slot" autocomplete="off">
    <div class="line">
      <span class="label">Ziel</span>
      <input id="paste" placeholder="Einfügen oder Karte antippen" enterkeyhint="go" aria-label="Koordinaten des Ziels">
      <span class="tools">
        <button id="pasteBtn" type="button" class="mc icon" data-icon="paste" aria-label="Aus Zwischenablage einfügen" hidden></button>
      </span>
    </div>
    <div id="targetLine" class="line" hidden>
      <span id="targetInfo" class="sub"></span>
      <span class="tools">
        <button id="copyTarget" type="button" class="mc icon" data-icon="copy" aria-label="Ziel kopieren"></button>
        <button id="shareTarget" type="button" class="mc icon" data-icon="share" aria-label="Ziel teilen"></button>
        <button id="saveTarget" type="button" class="mc icon" data-icon="star" aria-label="Ziel als Wegpunkt speichern"></button>
      </span>
    </div>
  </form>
</section>

<div id="wpSave" class="dialog" role="dialog" aria-modal="true" aria-labelledby="wpSaveTitle" hidden>
  <form class="box" id="wpSaveForm" autocomplete="off">
    <h2 id="wpSaveTitle">Wegpunkt speichern</h2>
    <div class="group">
      <span class="label">Name</span>
      <input id="wpName" maxlength="24" enterkeyhint="done" aria-label="Name des Wegpunkts">
    </div>
    <div class="group">
      <span class="label">Farbe</span>
      <div class="row" id="wpColors"></div>
    </div>
    <div class="actions">
      <button type="button" class="mc" id="wpCancel">Abbrechen</button>
      <button type="submit" class="mc">Speichern</button>
    </div>
  </form>
</div>

<div id="wpList" class="dialog" role="dialog" aria-modal="true" aria-labelledby="wpListTitle" hidden>
  <div class="box">
    <h2 id="wpListTitle">Wegpunkte</h2>
    <div id="wpItems" class="wp-items"></div>
    <button type="button" class="mc done" id="wpListDone">Fertig</button>
  </div>
</div>

<div id="achList" class="dialog" role="dialog" aria-modal="true" aria-labelledby="achTitle" hidden>
  <div class="box">
    <h2 id="achTitle">Fortschritte</h2>
    <div id="achItems" class="wp-items"></div>
    <button type="button" class="mc done" id="achDone">Fertig</button>
  </div>
</div>

<div id="settings" class="dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="box">
    <h2 id="settingsTitle">Einstellungen</h2>
    <div class="group">
      <span class="label">Karte</span>
      <div class="row">
        <button type="button" class="mc" data-kind="mc">Minecraft</button>
        <button type="button" class="mc" data-kind="normal">Normal</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Dimension</span>
      <div class="row">
        <button type="button" class="mc" data-dimension="overworld">Oberwelt</button>
        <button type="button" class="mc" data-dimension="nether">Nether</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Pixel</span>
      <div class="row">
        <button type="button" class="mc" data-pixel="fein">Fein</button>
        <button type="button" class="mc" data-pixel="mittel">Mittel</button>
        <button type="button" class="mc" data-pixel="grob">Grob</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Tag und Nacht</span>
      <div class="row">
        <button type="button" class="mc" data-daynight="real">Echt</button>
        <button type="button" class="mc" data-daynight="day">Immer Tag</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Wetter</span>
      <div class="row">
        <button type="button" class="mc" data-weather="real">Echt</button>
        <button type="button" class="mc" data-weather="off">Aus</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Ton</span>
      <div class="row">
        <button type="button" class="mc" data-sound="on">An</button>
        <button type="button" class="mc" data-sound="off">Aus</button>
      </div>
    </div>
    <button type="button" class="mc done" id="settingsDone">Fertig</button>
    <p class="version" id="version"></p>
  </div>
</div>

<script type="module">
import { VERSION, CONFIG, createConverter, facing, nether, fromNether, parseCoords, formatCoords } from "./coords.js?v=20261028g";
import { createMcMap, PIXEL_SIZES } from "./mcmap.js?v=20261028g";
import { icon } from "./icons.js?v=20261028g";
import { biomeFor } from "./biome.js?v=20261028g";
import { sunElevation, mcTicks, dayPhase, skyTint } from "./sky.js?v=20261028g";
import { describeWeather, fetchWeather, WeatherFx } from "./weather.js?v=20261028g";
import { COLORS, loadWaypoints, saveWaypoints, addWaypoint, removeWaypoint } from "./waypoints.js?v=20261028g";
import { ACHIEVEMENTS, placesReached, loadUnlocked, saveUnlocked } from "./achievements.js?v=20261028g";

const conv = createConverter(proj4);
const $ = (id) => document.getElementById(id);

// Pixel-Icons in alle Buttons mit data-icon setzen (vor eventuellem Text)
function fillIcons(root = document) {
  root.querySelectorAll("[data-icon]").forEach((b) => b.insertAdjacentHTML("afterbegin", icon(b.dataset.icon)));
}
fillIcons();
const state = { player: null, heading: null, target: null, biome: null };

// ---------- Einstellungen, gespeichert im Browser ----------
const settings = { kind: "mc", pixel: "mittel", sound: true, daynight: "real", weather: "real", dimension: "overworld" };
try {
  Object.assign(settings, JSON.parse(localStorage.getItem("mc-settings") ?? "{}"));
  if (localStorage.getItem("mc-sound") === "off") settings.sound = false;
} catch {}
if (!(settings.pixel in PIXEL_SIZES)) settings.pixel = "mittel";
function saveSettings() {
  try { localStorage.setItem("mc-settings", JSON.stringify(settings)); } catch {}
}

// ---------- Texturen: Erde und Gras als Pixelraster, jeder Pixel 4×4 ----------
function rng(seed) {
  return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32);
}
function texture(w, h, pick, seed, s = 4) {
  const c = document.createElement("canvas");
  c.width = w * s; c.height = h * s;
  const ctx = c.getContext("2d"), r = rng(seed);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    ctx.fillStyle = pick(x, y, r); ctx.fillRect(x * s, y * s, s, s);
  }
  return c.toDataURL();
}
const dirt = ["#866043", "#866043", "#79553a", "#9b7653", "#593d29", "#6c4b33"];
const grass = ["#5b8731", "#6aa83a", "#4a7027", "#5f9134"];
const dirtTex = texture(16, 16, (x, y, r) => dirt[Math.floor(r() * dirt.length)], 7, 3);

let audio;
function click() {
  if (!settings.sound) return;
  try {
    audio ??= new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = "square"; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(260, t + 0.06);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.09);

}

// ?zeit=22:30 zeigt eine andere Uhrzeit von heute, zum Ausprobieren
function now() {
  const m = /^(\d{1,2}):(\d{2})$/.exec(new URLSearchParams(location.search).get("zeit") ?? "");
  if (!m) return new Date();
  const d = new Date();
  d.setHours(Number(m[1]), Number(m[2]), 0, 0);
  return d;
}
function updateSky() {
  const date = now();
  const elevation = sunElevation(date, CONFIG.origin.lat, CONFIG.origin.lon);
  state.sky = { elevation, ticks: mcTicks(date, CONFIG.origin.lon), phase: dayPhase(elevation) };
  // Im Nether gibt es keinen Himmel, nur einen roten Dunst
  const tint = inNether() ? "rgb(255, 205, 190)" : settings.daynight === "real" ? skyTint(elevation) : null;
  $("sky").hidden = !tint;
  if (tint) $("sky").style.backgroundColor = tint;
  renderF3();
}

// Selbst erzeugtes Portal-Rauschen: zwei verstimmte Sägezähne, die abwärts gleiten
function portalSound() {
  if (!settings.sound) return;
  try {
    audio ??= new AudioContext();
    const t = audio.currentTime, g = audio.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    g.connect(audio.destination);
    for (const detune of [0, 7]) {
      const o = audio.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(220 + detune, t);
      o.frequency.exponentialRampToValueAtTime(70 + detune, t + 1.1);
      o.connect(g); o.start(t); o.stop(t + 1.15);
    }
  } catch {}
}

// ---------- Anzeige ----------
function renderF3() {
  const lines = [`Münster 1:${inNether() ? 8 : 1} · Spawn: ${CONFIG.origin.name}`];
  if (inNether()) lines.push('<span class="nether">Dimension: minecraft:the_nether</span>');
  const p = state.player;
  if (p) {
    const s = shown(p);
    lines.push(`XYZ: ${s.x} / ${s.y ?? "~"} / ${s.z}`);
    if (inNether()) lines.push(`Oberwelt: ${p.x} / ${p.z}`);
    else {
      const n = nether(p.x, p.z);
      lines.push(`Nether: ${n.x} / ${n.z}`);
    }
    lines.push(`Biome: ${state.biome ?? "~"}`);
    const spawn = directionTo(s, { x: 0, z: 0 });
    lines.push(spawn ? `Spawn: ${spawn.dist} Blöcke Richtung ${spawn.dir}` : "Spawn: hier!");
  } else {
    lines.push("XYZ: ~ / ~ / ~");
  }
  if (state.heading != null) {
    const f = facing(state.heading);
    lines.push(`Facing: ${f.name} (${f.towards}) (${f.yaw.toFixed(1)})`);
  }
  if (state.sky) lines.push(`Zeit: ${state.sky.ticks} ticks · ${state.sky.phase}`);
  if (state.weather && !inNether()) lines.push(`Wetter: ${state.weather.label}${state.weather.temp != null ? ` · ${Math.round(state.weather.temp)} °C` : ""}`);
  if (p) {
    const acc = [`GPS ±${Math.round(p.accuracy)} m`];
    if (p.altitudeAccuracy != null) acc.push(`Höhe ±${Math.round(p.altitudeAccuracy)} m`);
    lines.push("", `<span class="dim">${acc.join(" · ")}</span>`);
  }
  $("f3").innerHTML = lines.map((l) => (l === "" ? '<div class="gap"></div>' : `<div>${l}</div>`)).join("");
  $("meCoords").textContent = p ? fmt(p) : "~ ~ ~";
}

// Entfernung und Himmelsrichtung von a nach b; null, wenn beide auf demselben Block liegen
function directionTo(a, b) {
  const dx = b.x - a.x, dz = b.z - a.z;
  const dist = Math.round(Math.hypot(dx, dz));
  if (dist === 0) return null;
  // Richtung als Kompasskurs: atan2(Ost, Nord), Nord = −Z
  return { dist, dir: facing((Math.atan2(dx, -dz) * 180) / Math.PI).name };
}

function distanceText(t) {
  if (!state.player) return "";
  const d = directionTo(shown(state.player), shown(t));
  return d ? `${d.dist} Blöcke ${d.dir}` : "Du bist da!";
}

// Biom an der eigenen Position; braucht geladene Kartenkacheln rund um die Position
function updateBiome() {
  if (!state.player) return;
  const hits = mc.areasAt([state.player.lon, state.player.lat]);
  if (!hits) return;
  const biome = biomeFor(hits, settings.dimension);
  if (biome !== state.biome) { state.biome = biome; renderF3(); }
}
map.on("idle", updateBiome);

function renderTarget() {
  const t = state.target;
  $("targetLine").hidden = !t;
  if (!t) return;
  const n = nether(t.x, t.z);

  const other = inNether() ? `Oberwelt ${t.x} / ${t.z}` : `Nether ${n.x} / ${n.z}`;
  const parts = [distanceText(t), other].filter(Boolean).join(" · ");
  $("targetInfo").innerHTML = `${parts}<br>`

    + `<a href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank" rel="noopener">Google Maps</a>`;
}

// ---------- Kopieren, Einfügen, Teilen ----------
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = Object.assign(document.createElement("textarea"), { value: text, readOnly: true });
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.append(ta); ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  return ok;
}

async function copyCoords(c) {
  const text = fmt(c);
  if (await copyText(text)) { chat(`Koordinaten kopiert: ${text}`, "green"); unlock("share"); }
  else chat("Kopieren hat nicht geklappt.", "red");
}

function shareUrl(c) {
  const s = shown(c);
  const u = new URL(location.pathname, location.origin);
  u.searchParams.set("x", s.x);
  if (s.y != null) u.searchParams.set("y", s.y);
  u.searchParams.set("z", s.z);
  if (inNether()) u.searchParams.set("dim", "nether");
  return u.toString();
}

async function shareCoords(c, intro) {
  const text = `${intro} ${fmt(c)} ${inNether() ? "im Nether unter" : "in"} Münster ⛏`;
  const url = shareUrl(c);
  if (navigator.share) {
    try { await navigator.share({ title: "Münster in Minecraft-Koordinaten", text, url }); unlock("share"); }
    catch (err) { if (err.name !== "AbortError") chat("Teilen hat nicht geklappt.", "red"); }
    return;
  }
  if (await copyText(`${text} ${url}`)) { chat("Link kopiert, einfach einfügen und abschicken.", "green"); unlock("share"); }
  else chat("Teilen hat nicht geklappt.", "red");
}

// Selbst erzeugte kleine Fanfare: vier aufsteigende Rechteck-Töne
function fanfare() {
  if (!settings.sound) return;
  try {
    audio ??= new AudioContext();
    const t0 = audio.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = t0 + i * 0.09;
      o.type = "square"; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch {}
}
function showNextToast() {
  if (toastBusy || !toastQueue.length) return;
  toastBusy = true;
  const a = toastQueue.shift(), el = $("toast");
  el.innerHTML = `${icon("trophy", { size: 28, color: "#f5c842" })}<div><div class="head">Fortschritt erzielt!</div><div class="title"></div></div>`;
  el.querySelector(".title").textContent = a.title;
  requestAnimationFrame(() => el.classList.add("show"));
  fanfare();
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => { toastBusy = false; showNextToast(); }, 450);
  }, 4000);
}
function unlock(id) {
  const a = ACHIEVEMENTS.find((x) => x.id === id);
  if (!a || unlocked[id]) return;
  unlocked = { ...unlocked, [id]: new Date().toISOString().slice(0, 10) };

  chat(`Fortschritt erzielt: [${a.title}]`, "green");
  toastQueue.push(a);
  showNextToast();
}

  const c = parseCoords($("paste").value);
  if (!c) {
    if (announce && $("paste").value.trim()) chat("Darin stecken keine Koordinaten. Beispiel: 154 64 68", "red");
    return;
  }
  setTarget(fromShown(c), { pan });
  if (announce) chat(`Ziel gesetzt: ${formatCoords(c)}`, "yellow");
}

$("paste").addEventListener("input", (ev) => {
  const pasted = ev.inputType === "insertFromPaste";
  applyInput({ pan: pasted, announce: pasted });
});
$("goto").addEventListener("submit", (ev) => {
  ev.preventDefault();
  $("paste").blur();
  applyInput({ pan: true, announce: true });
});

if (navigator.clipboard?.readText) {
  $("pasteBtn").hidden = false;
  $("pasteBtn").addEventListener("click", async () => {
    try {
      $("paste").value = await navigator.clipboard.readText();
      applyInput({ pan: true, announce: true });
    } catch {
      chat("Kein Zugriff auf die Zwischenablage. Lange ins Feld tippen und einfügen.", "red");
    }
  });
}

// ---------- Zurück zur eigenen Position ----------
// Nach dem Antippen läuft die Karte mit, bis man sie selbst verschiebt.
const locate = Object.assign(document.createElement("div"), { className: "maplibregl-ctrl maplibregl-ctrl-group" });
locate.hidden = true;
locate.innerHTML = `<button type="button" class="locate" aria-label="Zur eigenen Position" title="Zur eigenen Position" aria-pressed="false">${icon("gps")}</button>`;
map.addControl({ onAdd: () => locate, onRemove() {} }, "bottom-right");
function setFollow(on) {
  state.follow = on;
  locate.querySelector("button").setAttribute("aria-pressed", String(on));
}
function centerOnPlayer() {
  if (!state.player) return;
  map.easeTo({ center: [state.player.lon, state.player.lat], zoom: Math.max(map.getZoom(), 16.5) });
}
locate.querySelector("button").addEventListener("click", () => { setFollow(true); centerOnPlayer(); });
// Nur echte Gesten beenden das Mitlaufen, nicht die eigenen easeTo-Bewegungen
map.on("dragstart", () => setFollow(false));

map.on("click", (ev) => {
  const p = conv.toMinecraft(ev.lngLat.lat, ev.lngLat.lng);
  const c = { x: p.x, y: null, z: p.z };
  $("paste").value = fmt(c);
  setTarget(c);
});

// ---------- GPS und Kompass ----------
// iOS liefert die Höhe schon über dem Meeresspiegel (Core Location), andere Systeme die rohe GPS-Höhe
// über dem Ellipsoid, die noch um die Geoidundulation korrigiert werden muss.
const ALTITUDE_IS_MSL = /iPhone|iPad|iPod/.test(navigator.userAgent)
  || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function onPosition(pos) {
  const { latitude: lat, longitude: lon, altitude, accuracy, altitudeAccuracy } = pos.coords;
  const p = conv.toMinecraft(lat, lon);
  const first = !state.player;
  const y = ALTITUDE_IS_MSL ? conv.yFromNN(altitude) : conv.yFromEllipsoidal(altitude);
  state.player = { ...p, y, lat, lon, accuracy, altitudeAccuracy };
  if (!playerMarker) playerMarker = mc.addMarker(playerEl(), [lon, lat]);
  else playerMarker.setLngLat([lon, lat]);
  mc.setAccuracy(lat, lon, accuracy);
  updateBiome();
  checkPositionAchievements();
  if (first) {
    locate.hidden = false;
    if (!state.target) { map.easeTo({ center: [lon, lat], zoom: 17 }); setFollow(true); }
    $("gps").hidden = true;
    $("copyMe").hidden = false;
    $("shareMe").hidden = false;
    $("saveMe").hidden = false;
    chat(`Position gefunden: ${fmt(state.player)}`, "green");
  } else if (state.follow) {
    map.easeTo({ center: [lon, lat], duration: 500 });
  }
  renderF3();
  renderTarget();
}

function onPositionError(err) {
  const msg = { 1: "Standortzugriff verweigert.", 2: "Position nicht verfügbar.", 3: "GPS-Zeitüberschreitung." }[err.code];
  chat(msg || err.message, "red");
  $("gps").disabled = false;
}

// Kompass: iOS liefert webkitCompassHeading, Android deviceorientationabsolute (alpha gegen den Uhrzeigersinn).
function onOrientation(ev) {
  let heading = null;
  if (typeof ev.webkitCompassHeading === "number") heading = ev.webkitCompassHeading;
  else if (ev.absolute && ev.alpha != null) heading = 360 - ev.alpha;
  if (heading == null) return;
  heading += screen.orientation?.angle ?? 0;
  state.heading = ((heading % 360) + 360) % 360;
  const arrow = playerMarker?.getElement().querySelector(".heading");
  if (arrow) {
    arrow.hidden = false;
    arrow.style.setProperty("--heading", `${state.heading}deg`);
  }
  renderF3();
}

async function startCompass() {
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) return;
  if (typeof DOE.requestPermission === "function") {
    try { if ((await DOE.requestPermission()) !== "granted") return; } catch { return; }
  }
  window.addEventListener("ondeviceorientationabsolute" in window ? "deviceorientationabsolute" : "deviceorientation", onOrientation);
}

$("gps").addEventListener("click", () => {
  if (!("geolocation" in navigator)) { chat("Kein GPS im Browser verfügbar.", "red"); return; }
  if (!window.isSecureContext) { chat("GPS braucht HTTPS (oder localhost).", "red"); return; }
  chat("Suche Position …", "gray");
  $("gps").disabled = true;
  startCompass();
  navigator.geolocation.watchPosition(onPosition, onPositionError, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
});

// ---------- Start ----------
updateSky();
updateWeather();
// Nur x, y und z aus dem Link lesen, andere Parameter (z. B. zeit) ignorieren
const params = new URLSearchParams(location.search);
const shared = params.has("x") && params.has("z")
  ? parseCoords(["x", "y", "z"].filter((k) => params.has(k)).map((k) => `${k}=${params.get(k)}`).join(" "))
  : null;
// Ein Link aus dem Nether öffnet die App im Nether, sonst bleibt die gespeicherte Dimension
if (shared && params.get("dim") === "nether" && !inNether()) setDimension("nether", { quiet: true });
if (shared) {
  $("paste").value = formatCoords(shared);
  setTarget(fromShown(shared), { pan: true });
  chat(`Geteilter Punkt${inNether() ? " im Nether" : ""}: ${formatCoords(shared)}`, "yellow");
  chat("Tippe auf GPS starten, um die Entfernung zu sehen.", "gray");
} else {
  chat("Willkommen in Münster! Der Spawn ist am Dom.", "yellow");
}
</script>
